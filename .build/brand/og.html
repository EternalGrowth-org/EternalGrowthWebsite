<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;isolation:isolate;background:#f2f2ef;color:#0b0b0b;font-family:Archivo,sans-serif;box-sizing:border-box;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
body::before{content:'';position:absolute;inset:-20%;z-index:-1;background:radial-gradient(38% 46% at 82% 28%,rgba(11,11,11,.10),transparent 70%),radial-gradient(40% 50% at 12% 92%,rgba(11,11,11,.08),transparent 70%),radial-gradient(30% 40% at 55% 60%,rgba(255,255,255,.9),transparent 70%);filter:blur(30px)}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;font-stretch:88%;font-size:30px;letter-spacing:-.02em}
.brand img{width:44px;height:44px}
h1{margin:0;max-width:15ch;font-size:92px;line-height:.98;font-weight:600;font-stretch:88%;letter-spacing:-.035em}
.foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(11,11,11,.16);padding-top:26px;font-size:22px;color:#4a4a46}
.foot b{color:#0b0b0b;font-weight:600}
.pill{background:#0b0b0b;color:#f2f2ef;border-radius:999px;padding:12px 22px;font-weight:600;font-size:21px}
</style></head><body>
<div class="brand"><img src="../../favicon.svg" alt="">Eternal Growth</div>
<h1>Student-run tutoring on Long Island.</h1>
<div class="foot"><span><b>$35,000+</b> raised &nbsp;·&nbsp; Math, English, science, coding, music</span><span class="pill">eternalgrowth.org</span></div>
</body></html>
